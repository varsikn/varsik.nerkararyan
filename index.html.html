<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Varsik Nerkararyan — Learning &amp; Talent Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0A0A0C; --black-2:#131316; --black-3:#1B1B1F;
  --paper:#F2F0EA;
  --turq:#10E6DB; --orange:#FFA24D; --purple:#5E10E6; --purple-soft:#9A7FD1; --plum:#800080;
  --ink: var(--paper); --ink-soft:#A7A7AC; --line:#2A2A2E;
  --serif:'Fraunces',serif; --sans:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:64px;}
*{box-sizing:border-box;}
body{margin:0;background:var(--black);color:var(--ink);font-family:var(--sans);line-height:1.6;
  -webkit-font-smoothing:antialiased;}
.wrap{max-width:760px;margin:0 auto;padding:0 24px;}
a{color:inherit;}
img,svg{max-width:100%;}

/* NAV */
nav{position:sticky;top:0;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,10,12,.86);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.nav-inner{max-width:760px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.nav-name{font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:.01em;white-space:nowrap;text-decoration:none;color:var(--ink);}
.nav-links{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;}
.nav-links::-webkit-scrollbar{display:none;}
.nav-links a{font-size:13px;color:var(--ink-soft);text-decoration:none;white-space:nowrap;font-family:var(--mono);}
.nav-links a:hover{color:var(--turq);}
.lang-toggle{display:flex;gap:2px;border:1px solid var(--line);border-radius:20px;padding:2px;flex-shrink:0;}
.lang-toggle button{border:none;background:transparent;font-family:var(--mono);font-size:11px;font-weight:500;
  padding:5px 11px;border-radius:16px;cursor:pointer;color:var(--ink-soft);}
.lang-toggle button.active{background:var(--turq);color:var(--black);}

/* SECTIONS — full-bleed band per section, alternating tone, colored top rule for wayfinding */
section{padding:0;border-top:1px solid var(--acc,var(--turq));}
section .inner{padding:52px 0;}
.sec-a{background:var(--black);}
.sec-b{background:var(--black-2);}
.section-tag{font-family:var(--mono);font-size:12px;color:var(--acc);font-weight:500;margin:0 0 14px;
  display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.06em;}
.section-tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc);flex-shrink:0;}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;color:var(--ink);}
h2{font-size:clamp(24px,4vw,32px);margin-bottom:20px;line-height:1.15;font-weight:600;}
p{margin:0 0 14px;color:var(--ink-soft);max-width:64ch;}
p:last-child{margin-bottom:0;}
ul{margin:0 0 14px;padding-left:20px;color:var(--ink-soft);}
li{margin-bottom:6px;}
li::marker{color:var(--acc);}

/* HERO */
.hero .inner{padding-top:60px;padding-bottom:64px;}
.hero-grid{display:flex;gap:40px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;}
.hero-text{flex:1 1 380px;min-width:260px;}
.hero-photo{flex:0 0 auto;}
.hero-photo img{width:152px;height:152px;border-radius:50%;object-fit:cover;display:block;
  border:3px solid var(--turq);box-shadow:0 0 0 6px rgba(16,230,219,.14),0 16px 34px rgba(0,0,0,.55);}
@media(max-width:640px){
  .hero-grid{flex-direction:column-reverse;align-items:flex-start;gap:24px;}
  .hero-photo img{width:104px;height:104px;}
}
.hero-kicker{display:flex;flex-direction:column;gap:3px;margin-bottom:24px;font-family:var(--mono);}
.hero-kicker span{font-size:12.5px;color:var(--turq);font-weight:500;}
.hero-kicker span:nth-child(2){color:var(--orange);}
.hero-kicker span:nth-child(3){color:var(--turq);}
.hero h1{font-size:clamp(32px,6vw,46px);line-height:1.06;margin-bottom:22px;font-weight:600;}
.hero-lede{font-family:var(--serif);font-size:18px;color:var(--ink);font-weight:400;max-width:56ch;margin-bottom:14px;}
.hero p{font-size:15.5px;}
.hero-ctas{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap;}
.btn{display:inline-block;padding:12px 22px;border-radius:2px;font-size:13.5px;font-weight:600;text-decoration:none;
  border:1px solid var(--ink);cursor:pointer;font-family:var(--sans);background:transparent;color:var(--ink);
  transition:background .15s,border-color .15s,color .15s;}
.btn.primary{background:var(--turq);border-color:var(--turq);color:var(--black);}
.btn:hover{border-color:var(--acc,var(--turq));color:var(--acc,var(--turq));}
.btn.primary:hover{background:transparent;color:var(--turq);}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:30px 20px;}
@media(min-width:560px){.stats{grid-template-columns:repeat(3,1fr);}}
.stat{border-top:2px solid var(--acc);padding-top:10px;}
.stat .num{font-family:var(--serif);font-size:clamp(26px,5vw,34px);color:var(--ink);line-height:1;font-weight:600;}
.stat .label{font-size:13px;font-weight:600;margin-top:6px;color:var(--ink);}
.stat .sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

/* WORK AREAS */
.area{padding:22px 0 22px 20px;border-left:2px solid var(--line);margin-bottom:6px;}
.area h3{font-size:19px;margin-bottom:10px;}
.area .q{font-family:var(--serif);font-style:italic;color:var(--acc);font-size:16px;margin-top:14px;}

/* SELECTED WORK */
.work-item{padding:26px 0;border-top:1px solid var(--line);}
.work-item:first-child{border-top:none;padding-top:0;}
.work-item h3{font-size:20px;margin-bottom:4px;}
.work-item .subtitle{font-size:13.5px;color:var(--acc);font-weight:600;margin-bottom:12px;font-family:var(--mono);}
.work-item .q{font-family:var(--serif);font-style:italic;color:var(--acc);font-size:15.5px;margin-top:10px;}

/* CAREER TIMELINE */
.tl-item{position:relative;padding:0 0 34px 24px;border-left:2px solid var(--line);}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:"";position:absolute;left:-6px;top:2px;width:10px;height:10px;border-radius:50%;
  background:var(--acc);box-shadow:0 0 0 3px var(--black-2);}
.tl-org{font-family:var(--serif);font-size:19px;margin-bottom:2px;font-weight:600;}
.tl-role{font-size:13.5px;font-weight:600;color:var(--acc);font-family:var(--mono);}
.tl-dates{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}

/* EVOLUTION */
.evo-steps{margin:22px 0;}
.evo-step{padding:9px 0;}
.evo-step .txt{font-family:var(--serif);font-size:17px;}
.evo-arrow{color:var(--acc);font-size:14px;padding-left:2px;}
.evo-closing{font-family:var(--serif);font-size:19px;color:var(--acc);margin-top:12px;font-weight:500;}

/* CHIPS */
.chip-list{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px;}
.chip{border:1px solid var(--acc);border-radius:20px;padding:6px 13px;font-size:12.5px;color:var(--acc);font-family:var(--mono);}

/* POV */
.pov-q{font-family:var(--serif);font-size:17px;color:var(--ink);margin:4px 0;}
.pov-q::before{content:"— ";color:var(--acc);}

/* EDUCATION / PUBS */
.ed-item{padding:12px 0;border-top:1px solid var(--line);}
.ed-item:first-child{border-top:none;}
.ed-item .t{font-weight:600;font-size:14.5px;color:var(--ink);}
.ed-item .s{font-size:12.5px;color:var(--acc);font-family:var(--mono);}

/* CONTACT */
.contact-info{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0 28px;}
.contact-card{display:flex;align-items:center;gap:14px;padding:14px 20px 14px 14px;border-radius:6px;
  border:1px solid var(--line);background:var(--black-2);text-decoration:none;
  transition:border-color .15s,transform .15s,background .15s;}
.contact-card:hover{border-color:var(--acc);transform:translateY(-2px);background:color-mix(in srgb, var(--acc) 8%, var(--black-2));}
.contact-card .icon{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb, var(--acc) 16%, transparent);}
.contact-card .icon svg{width:20px;height:20px;stroke:var(--acc);}
.contact-card .text{display:flex;flex-direction:column;gap:2px;}
.contact-card .label{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;}
.contact-card .value{font-family:var(--sans);font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap;}
@media(max-width:480px){.contact-card{padding:12px 16px 12px 12px;} .contact-card .value{font-size:14.5px;}}
.contact-tags{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 26px;}
.ctas{display:flex;flex-direction:column;}
.cta-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;border-top:1px solid var(--line);flex-wrap:wrap;}
.cta-row .q{font-size:14.5px;max-width:38ch;color:var(--ink);}

footer{padding:0;background:var(--black);border-top:1px solid var(--line);}
footer .inner{padding:34px 0 44px;}
.footer-name{font-family:var(--serif);font-size:16px;margin-bottom:4px;font-weight:600;}
.footer-tags{font-size:12px;color:var(--ink-soft);margin-bottom:10px;font-family:var(--mono);}
.footer-tagline{font-size:13px;font-style:italic;color:var(--turq);margin-bottom:16px;}
.footer-bottom{font-size:12px;color:var(--ink-soft);}

/* RESPONSIVE LAYOUT PATCH — preserves all existing content and visual styling */
html, body {
  width: 100%;
  min-width: 0;
  overflow-x: clip;
}
body {
  overflow-wrap: anywhere;
}
.wrap,
.nav-inner,
section .inner,
footer .inner {
  min-width: 0;
}
#app,
#app * {
  min-width: 0;
}
img, svg, video, canvas, iframe {
  max-width: 100%;
}
p, li, .stat .label, .stat .sub, .work-item, .area,
.tl-org, .tl-role, .tl-dates, .ed-item, .cta-row .q {
  overflow-wrap: anywhere;
  word-break: normal;
}
.nav-inner {
  flex-wrap: wrap;
}
.nav-name {
  flex: 0 1 auto;
  min-width: 0;
}
.nav-links {
  min-width: 0;
  max-width: 100%;
}
.hero-grid > *,
.contact-info > *,
.contact-card .text,
.contact-card .value {
  min-width: 0;
}
.contact-card .value {
  white-space: normal;
  overflow-wrap: anywhere;
}
.hero-ctas .btn,
.cta-row .btn {
  max-width: 100%;
  white-space: normal;
  text-align: center;
}
.chip-list,
.contact-tags {
  max-width: 100%;
}
.chip {
  max-width: 100%;
  overflow-wrap: anywhere;
  white-space: normal;
}
@media (max-width: 640px) {
  .wrap {
    padding-left: 18px;
    padding-right: 18px;
  }
  .nav-inner {
    padding: 12px 18px;
    gap: 10px;
  }
  .nav-name {
    white-space: normal;
    overflow-wrap: anywhere;
    flex: 1 1 150px;
  }
  .nav-links {
    order: 3;
    flex: 1 1 100%;
    display: flex;
    flex-wrap: wrap;
    overflow: visible;
    gap: 8px 14px;
    padding-top: 2px;
  }
  .nav-links a {
    white-space: normal;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .lang-toggle {
    margin-left: auto;
  }
  section .inner {
    padding-top: 38px;
    padding-bottom: 38px;
  }
  .hero .inner {
    padding-top: 38px;
    padding-bottom: 42px;
  }
  .hero-text {
    flex-basis: 100%;
    width: 100%;
    min-width: 0;
  }
  .hero h1 {
    font-size: clamp(30px, 8vw, 40px);
    overflow-wrap: anywhere;
  }
  .hero-lede {
    font-size: 17px;
  }
  .stats {
    gap: 24px 14px;
  }
  .area {
    padding-left: 14px;
  }
  .contact-info {
    flex-direction: column;
    align-items: stretch;
  }
  .contact-card {
    width: 100%;
    max-width: 100%;
    padding: 12px;
    gap: 10px;
  }
  .contact-card .value {
    font-size: 14.5px;
  }
  .cta-row {
    align-items: flex-start;
    gap: 10px;
  }
  .cta-row .q,
  .cta-row .btn {
    width: 100%;
    max-width: 100%;
  }
}
@media (max-width: 380px) {
  .wrap {
    padding-left: 14px;
    padding-right: 14px;
  }
  .nav-inner {
    padding-left: 14px;
    padding-right: 14px;
  }
  .nav-name {
    font-size: 13px;
    flex-basis: 130px;
  }
  .lang-toggle button {
    padding: 5px 8px;
  }
  .hero h1 {
    font-size: clamp(28px, 8.5vw, 34px);
  }
  .stats {
    grid-template-columns: minmax(0, 1fr);
  }
  .contact-card .icon {
    width: 36px;
    height: 36px;
  }
}

</style>
</head>

/* accent rotation per section, alternating band tone for visual separation */
const ACCENTS = ['turq','orange'];
const secCount = {n:0};
function secOpen(id){
  const acc = ACCENTS[secCount.n % 3];
  const tone = secCount.n % 2 === 0 ? 'sec-a' : 'sec-b';
  secCount.n++;
  const idAttr = id ? ` id="${id}"` : '';
  return `<section${idAttr} class="${tone}" style="--acc:var(--${acc})"><div class="inner wrap">`;
}
const secClose = '</div></section>';

function render(lang){
  const t = C[lang];
  document.documentElement.lang = lang==='hy' ? 'hy' : 'en';
  document.getElementById('btn-en').classList.toggle('active', lang==='en');
  document.getElementById('btn-hy').classList.toggle('active', lang==='hy');
  document.querySelectorAll('[data-t]').forEach(el=>{
    const path = el.getAttribute('data-t').split('.');
    let v = t; path.forEach(p=>v=v&&v[p]);
    if(v) el.textContent = v;
  });

  secCount.n = 0;
  const html = `
  ${secOpen('home').replace('inner wrap','inner wrap hero')}
    <div class="hero-grid">
      <div class="hero-text">
        <div class="hero-kicker">${t.hero.kicker.map(k=>`<span>${k}</span>`).join('')}</div>
        <h1>${t.hero.name}</h1>
        <p class="hero-lede">${t.hero.lede}</p>
        <p>${t.hero.body}</p>
        <div class="hero-ctas">
          <a class="btn primary" href="#work">${t.hero.cta1}</a>
          <a class="btn" href="${CV_URL}" onclick="saveCV(event)">${t.hero.cta2}</a>
        </div>
      </div>
      <div class="hero-photo"><img src="${PHOTO_B64}" alt="${t.hero.name}"></div>
    </div>
  ${secClose}

  ${secOpen()}
    <p class="section-tag">01 · ${t.statsTitle}</p>
    <h2>${t.statsTitle}</h2>
    <div class="stats">
      ${t.stats.map(s=>`<div class="stat"><div class="num">${s.num}</div><div class="label">${s.label}</div><div class="sub">${s.sub}</div></div>`).join('')}
    </div>
  ${secClose}

  ${secOpen('work')}
    <p class="section-tag">02 · ${t.workTitle}</p>
    <h2>${t.workTitle}</h2>
    ${t.areas.map(a=>`
      <div class="area">
        <h3>${a.h}</h3>
        <p>${a.p}</p>
        ${a.p2?`<p>${a.p2}</p>`:''}
        ${a.items?list(a.items):''}
        ${a.q?`<p class="q">"${a.q}"</p>`:''}
      </div>`).join('')}
  ${secClose}

  ${secOpen()}
    <p class="section-tag">03 · ${t.workSelTitle}</p>
    <h2>${t.workSelTitle}</h2>
    ${t.works.map(w=>`
      <div class="work-item">
        <h3>${w.h}</h3>
        <div class="subtitle">${w.sub}</div>
        <p>${w.p}</p>
        ${w.p2?`<p>${w.p2}</p>`:''}
        ${w.items?list(w.items):''}

function b64ToBlob(b64, mime){
  const bytes = atob(b64);
  const arr = new Uint8Array(bytes.length);
  for(let i=0;i<bytes.length;i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([arr], {type: mime});
}
const CV_B64_RAW = CV_URL.split(',')[1];

async function saveCV(e){
  if(e) e.preventDefault();
  try{
    if(typeof claude !== "undefined"){
      const downloads = await claude.use("downloads");
      if(downloads){
        const blob = b64ToBlob(CV_B64_RAW, "application/pdf");
        await downloads.save({ filename: "Varsik_Nerkararyan_CV.pdf", data: blob });
        return;
      }
    }
  }catch(err){ /* fall through */ }
  // fallback for plain web hosting: trigger a real download via a temporary link
  try{
    const blob = b64ToBlob(CV_B64_RAW, "application/pdf");
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = "Varsik_Nerkararyan_CV.pdf";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
  }catch(err2){
    // last resort: open in a new tab
    window.open(CV_URL, "_blank");
  }
}

}
